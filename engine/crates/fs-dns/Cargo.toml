[package]
name = "fs-dns"
description = "DNS messages and transports (DoH, DNS53, BlockAll) for the RethinkReloaded engine (port of firestack intra/xdns, doh, dns53)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fs-core = { path = "../fs-core" }
fs-dialers = { path = "../fs-dialers" }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util", "sync"] }
parking_lot.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
h2 = "0.4"
http = "1"
bytes = "1"
base64 = "0.22"
# DNSCrypt: NaCl secretbox over XSalsa20 / XChaCha20, X25519, ed25519 certificates
salsa20 = "0.10"
chacha20 = "0.9"
poly1305 = "0.8"
x25519-dalek = "2"
ring = "0.17"
# ODoH (RFC 9230): HPKE-sealed queries (Cloudflare's odoh-rs, the counterpart of the odoh-go firestack uses)
odoh-rs = "1"
# ECH: client-side HPKE for rustls (its ring provider has none)
hpke = { version = "0.14", default-features = false, features = ["getrandom", "alloc", "x25519", "aes", "chacha"] }
rand_core = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util", "sync", "rt-multi-thread"] }
rustls-pki-types = "1.12"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
