[package]
name = "fs-dns"
description = "DNS messages and transports (DoH, DNS53, BlockAll) for the RethinkReloaded engine (port of firestack intra/xdns, doh, dns53)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fs-core = { path = "../fs-core" }
fs-dialers = { path = "../fs-dialers" }
hickory-proto = { version = "0.25", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util", "sync"] }
parking_lot.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
h2 = "0.4"
http = "1"
bytes = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util", "sync", "rt-multi-thread"] }
rustls-pki-types = "1.12"
