[package]
name = "fs-dialers"
description = "Protected sockets for the RethinkReloaded engine (port of firestack intra/protect + intra/dialers basics)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fs-core = { path = "../fs-core" }
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "io-util", "rt-multi-thread", "test-util"] }
