[package]
name = "fs-proxy"
description = "Proxies for the RethinkReloaded engine: registry, routing, built-in, SOCKS5, HTTP and WireGuard proxies (port of firestack intra/ipn)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fs-core = { path = "../fs-core" }
fs-dialers = { path = "../fs-dialers" }
fs-dns = { path = "../fs-dns" }
base64 = "0.22"
rustls-pki-types = { version = "1.12", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
fs-iptree = { path = "../fs-iptree" }
bytes = "1"
gotatun = { version = "0.10.3", default-features = false, features = ["device", "ring"] }
ipnetwork = "0.21"
smoltcp = { version = "0.14", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp", "async"] }
parking_lot.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "sync", "io-util"] }

[features]
# wg::peer: an in-process WireGuard far end (tests, e2e/wg-peer)
peer = []

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time", "rt", "macros", "sync", "io-util", "rt-multi-thread"] }
