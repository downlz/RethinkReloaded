[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MPL-2.0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
         "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = [
  { name = "openssl-sys", reason = "ring/rustls only; no system OpenSSL on Android" },
  { name = "native-tls" },
  { name = "aws-lc-sys", reason = "needs cmake/NASM in the NDK build; use ring" },
  { name = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
