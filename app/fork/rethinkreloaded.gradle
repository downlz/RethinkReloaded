// RethinkReloaded branding layer (fork-owned; applied from the end of app/build.gradle.kts).
//
// Groovy (not Kotlin DSL) on purpose: a Kotlin script plugin cannot see the Android Gradle Plugin's types from the
// app's classloader, whereas Groovy resolves `android {}` / `androidComponents {}` dynamically. This keeps the
// upstream diff to a single `apply(from = ...)` line. See docs/fork/BRANDING.md.
// Credit for the app remains with Celzero and the RethinkDNS contributors.
//
//  * applicationId -> io.github.downlz.rethinkreloaded (Kotlin namespace/packages stay com.celzero.bravedns)
//  * BuildConfig.RR_RPN_ENABLED = false (RPN / Rethink Plus is not offered by the fork)
//  * versionCode: upstream's (abi * 10_000_000 + VERSION_CODE) becomes (abi * 10_000_000 + VERSION_CODE * 100 + rrRevision)
//    so fork re-releases on the same upstream base (-PrrRevision=N, from tag vX.Y.Z-rr.N) can be upgraded.
//    gradle.properties VERSION_CODE / BuildConfig.BASE_VERSION_CODE stay upstream's (sent to Celzero's servers).
//  * resource overlays: app/fork/res (fork strings, bottom nav without RPN) and a generated app_name overlay
//    covering every locale that upstream (or Weblate) overrides, so no upstream strings.xml is edited.

def rrApplicationId = 'io.github.downlz.rethinkreloaded'
def rrAppName = 'RethinkReloaded'
int rrRevision = (findProperty('rrRevision') ?: '0').toString().toInteger()
if (rrRevision < 0 || rrRevision > 99) throw new GradleException("rrRevision must be 0..99, got $rrRevision")

android {
    defaultConfig {
        applicationId = rrApplicationId
        buildConfigField('boolean', 'RR_RPN_ENABLED', 'false')
        buildConfigField('int', 'RR_REVISION', rrRevision.toString())
    }
}

/**
 * For each overridden string name (app_name, app_name_small_case), writes values{-qualifier}/rr_branding.xml
 * for every qualifier whose upstream strings.xml defines that name, so every locale shows the fork's name.
 */
abstract class RrNameOverlayTask extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getUpstreamStrings()

    @Input
    abstract MapProperty<String, String> getNames()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        File out = outputDir.get().asFile
        out.deleteDir()
        Map<String, Map<String, String>> byQualifier = new TreeMap<>()
        names.get().each { name, value ->
            byQualifier.computeIfAbsent('values') { new TreeMap<>() }.put(name, value)
            upstreamStrings.files.findAll { it.name == 'strings.xml' && it.text.contains("name=\"${name}\"") }
                .each { byQualifier.computeIfAbsent(it.parentFile.name) { new TreeMap<>() }.put(name, value) }
        }
        byQualifier.each { q, entries ->
            File dir = new File(out, q)
            dir.mkdirs()
            String body = entries.collect { name, value ->
                String esc = value.replace('&', '&amp;').replace('<', '&lt;').replace("'", "\\'")
                "    <string name=\"${name}\" translatable=\"false\">${esc}</string>"
            }.join('\n')
            new File(dir, 'rr_branding.xml').text = """<?xml version="1.0" encoding="utf-8"?>
<!-- generated by app/fork/rethinkreloaded.gradle; do not edit -->
<resources>
${body}
</resources>
"""
        }
    }
}

def upstreamStringFiles = fileTree('src') {
    include 'main/res/values*/strings.xml', 'tv/res/values*/strings.xml', 'full/res/values*/strings.xml'
}
def forkRes = layout.projectDirectory.dir('fork/res').asFile.absolutePath

androidComponents {
    onVariants(selector().all()) { variant ->
        // alpha is upstream's nightly channel (own resValue app_name); the fork does not ship it.
        if (variant.buildType == 'alpha') return

        boolean isTv = variant.productFlavors.any { it.second == 'tv' }
        def overlay = tasks.register('rrNameOverlay' + variant.name.capitalize(), RrNameOverlayTask) {
            upstreamStrings.from(upstreamStringFiles)
            names.put('app_name', isTv ? "$rrAppName TV".toString() : rrAppName)
            names.put('app_name_small_case', rrAppName.toLowerCase())
        }
        variant.sources.res?.addStaticSourceDirectory(forkRes)
        variant.sources.res?.addGeneratedSourceDirectory(overlay,
            { RrNameOverlayTask t -> t.outputDir } as kotlin.jvm.functions.Function1)

        // Runs after upstream's ABI versionCode callback (this script is applied later).
        variant.outputs.each { output ->
            Integer upstreamCode = output.versionCode.orNull
            if (upstreamCode == null) return
            int abiMultiplier = upstreamCode.intdiv(10_000_000)
            int base = upstreamCode % 10_000_000
            output.versionCode.set(abiMultiplier * 10_000_000 + base * 100 + rrRevision)
        }
    }
}
