# Opens an issue when celzero/rethink-app publishes a release newer than .fork/UPSTREAM.
# The issue body is the --dry-run report of scripts/rr/sync-release.sh (see docs/fork/UPSTREAM_SYNC.md).
name: rr-upstream-watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compare upstream release with .fork/UPSTREAM
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/celzero/rethink-app/releases/latest --jq .tag_name)
          current=$(cat .fork/UPSTREAM)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "upstream latest: $latest, fork synced: $current"
      - name: Dry-run sync report
        if: steps.cmp.outputs.latest != steps.cmp.outputs.current
        run: |
          git config user.name "rr-bot"; git config user.email "rr-bot@users.noreply.github.com"
          git remote add upstream https://github.com/celzero/rethink-app.git
          scripts/rr/sync-release.sh --dry-run "${{ steps.cmp.outputs.latest }}" > report.txt 2>&1 || true
          tail -c 60000 report.txt > report-trimmed.txt
      - name: Open issue (once per release)
        if: steps.cmp.outputs.latest != steps.cmp.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.cmp.outputs.latest }}
          CURRENT: ${{ steps.cmp.outputs.current }}
        run: |
          title="upstream-sync: $LATEST"
          if gh issue list --state all --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
            echo "issue already exists"; exit 0
          fi
          gh label create upstream-sync --color 0E8A16 --description "celzero/rethink-app release to merge" 2>/dev/null || true
          {
            echo "celzero/rethink-app released **$LATEST** (fork is on **$CURRENT**)."
            echo "Release notes: https://github.com/celzero/rethink-app/releases/tag/$LATEST"
            echo
            echo "Follow docs/fork/UPSTREAM_SYNC.md §4: \`scripts/rr/sync-release.sh $LATEST\`"
            echo
            echo '<details><summary>dry-run report</summary>'
            echo; echo '```'; cat report-trimmed.txt; echo '```'; echo '</details>'
          } > body.md
          gh issue create --title "$title" --label upstream-sync --body-file body.md
