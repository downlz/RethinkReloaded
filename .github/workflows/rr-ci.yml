# RethinkReloaded CI: fork-integrity checks + builds with the Go engine (upstream AAR) and, once present,
# the Rust engine (engine/). Upstream's own android.yml / codeql.yml etc. keep running unchanged.
name: rr-ci

on:
  push:
    branches: [ "main", "sync/**", "engine/**", "fork/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rr-ledger:
    name: fork ledger + RPN tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/celzero/rethink-app.git
          git fetch --quiet upstream --tags
      - run: scripts/rr/check-ledger.sh
      - run: scripts/rr/rpn-tripwire.sh

  build-go:
    name: app (Go engine)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # versionName comes from `git describe --tags`
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Assemble + parity unit tests (fdroid)
        run: ./gradlew --no-daemon :app:assembleFdroidFullDebug :app:testFdroidFullDebugUnitTest $(scripts/rr/parity-test-args.sh)
      - name: Verify identity
        run: |
          apk=$(ls app/build/outputs/apk/fdroidFull/debug/*universal*.apk 2>/dev/null | head -1)
          [ -n "$apk" ] || apk=$(ls app/build/outputs/apk/fdroidFull/debug/*.apk | head -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt2" dump badging "$apk" | grep -E "^package: name='io.github.downlz.rethinkreloaded" \
            || { echo "unexpected applicationId"; "$aapt2" dump badging "$apk" | head -3; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rethinkreloaded-fdroid-debug-go
          path: app/build/outputs/apk/fdroidFull/debug/*.apk
          retention-days: 14

  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Rust toolchain (engine/rust-toolchain.toml, incl. Android targets) + cargo-ndk
        working-directory: engine
        run: |
          rustup show
          cargo install cargo-ndk --locked --version 4.1.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}
      - name: Host tests + lint
        working-directory: engine
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --locked -- -D warnings
          cargo fmt --all --check
      - name: JVM <-> Rust JNI tests (vendored facade against host libgojni)
        run: ./gradlew --no-daemon -p engine/android :host-test:test
      - name: App with Rust engine (assemble + parity unit tests)
        run: ./gradlew --no-daemon -PfirestackRepo=rust :app:assembleFdroidFullDebug :app:testFdroidFullDebugUnitTest $(scripts/rr/parity-test-args.sh)
      - name: API contract vs upstream firestack
        run: engine/tools/api-contract.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rethinkreloaded-fdroid-debug-rust
          path: app/build/outputs/apk/fdroidFull/debug/*.apk
          retention-days: 14
